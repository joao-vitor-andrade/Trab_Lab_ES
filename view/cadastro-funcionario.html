<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <title>CyberZone - Cadastrar Funcionário</title>
</head>
<body>
    <header>
        <section class="topo-marca"><h1>CYBERZONE</h1></section>
        <a href="#" id="botao-sair" onclick="realizarLogoutView()">Sair</a>
    </header>
    <nav class="menu-colorido">
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="cadastro-cliente.html">Cad. Cliente</a></li>
            <li><a href="cadastro-computador.html">Cad. Computador</a></li>
            <li><a href="cadastro-funcionario.html">Cad. Funcionário</a></li>
            <li><a href="cadastro-produto.html">Cad. Produto</a></li>
            <li><a href="visualizar-clientes.html">Ver Clientes</a></li>
            <li><a href="visualizar-computadores.html">Ver Computadores</a></li>
            <li><a href="visualizar-funcionarios.html">Ver Funcionários</a></li>
            <li><a href="visualizar-produtos.html">Ver Produtos</a></li>
            <li><a href="uso-maquina.html">Uso de Máquina</a></li>
            <li><a href="venda.html">Venda</a></li>
        </ul>
    </nav>
    <main class="cadastro-main">
        <section class="cadastro-caixa">
            <h2>Cadastrar Funcionário</h2>
            <form class="cadastro-form" id="form-funcionario">
                <input type="text" id="nome-funcionario" placeholder="Nome" required>
                <input type="text" id="sobrenome-funcionario" placeholder="Sobrenome" required>
                <input type="text" id="cpf-funcionario" placeholder="CPF" inputmode="numeric" required>
                <input type="date" id="data-nascimento-funcionario" title="Data de Nascimento" required>
                <input type="tel" id="telefone-funcionario" placeholder="Telefone" inputmode="numeric" required>
                <select id="cargo-funcionario" required>
                    <option value="" disabled selected>Cargo / Função</option>
                    <option value="gerente">Gerente</option>
                    <option value="atendente">Atendente</option>
                    <option value="tecnico">Técnico de TI</option>
                    <option value="caixa">Caixa</option>
                </select>
                <input type="text" id="salario-funcionario" placeholder="Salário (Ex: 2.500,00)" inputmode="numeric" required>
                <input type="email" id="email-funcionario" placeholder="Email" required>
                <input type="password" id="senha-funcionario" placeholder="Senha" required>
                <button type="button" onclick="cadastrarFuncionario()">CADASTRAR</button>
            </form>
        </section>
    </main>
    <footer>
<section class="rodape-fim"><p>© 2025 CyberZone Lan House. Todos os direitos acadêmicos reservados.</p></section>
    </footer>
    <script src="../js/main.js" type="module"></script>
    
</body>
</html>
