<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <title>CyberZone - Recuperar Senha</title>
</head>

<body>

    <header class="topo-entrada">

        <section class="marca-autenticacao">
            <h1>
                CYBERZONE
                <span>Recuperar Senha</span>
            </h1>
        </section>

        <a href="../index.html" class="suporte-acesso">
            ← Voltar ao login
        </a>

    </header>

    <section class="area-autenticacao">

        <section class="bloco-entrada">

            <article class="painel-login">

                <h2>Recuperar Senha</h2>

                <p style="
                    text-align:center;
                    margin-bottom:1.5vh;
                    font-size:0.9rem;
                    opacity:0.8;
                ">
                    Informe seu CPF e e-mail cadastrado para identificar sua conta.
                </p>

                <!-- FORM RECUPERAR -->
                <section
                    class="formulario-dados"
                    id="form-recuperar-senha"
                >

                    <input
                        type="text"
                        id="cpf-recuperar"
                        placeholder="CPF (somente números)"
                        inputmode="numeric"
                        required
                    >

                    <input
                        type="email"
                        id="email-recuperar"
                        placeholder="E-mail cadastrado"
                        required
                    >

                    <button
                        type="button"
                        id="botao-entre"
                        onclick="recuperarSenha()"
                    >
                        VERIFICAR
                    </button>

                    <section class="recursos-extras">

                        <a href="../index.html">
                            ← Voltar ao login
                        </a>

                    </section>

                </section>

                <!-- FORM NOVA SENHA -->
                <section
                    class="formulario-dados"
                    id="form-nova-senha"
                    style="display:none;"
                >

                    <p style="
                        text-align:center;
                        color:#00e5ff;
                        margin-bottom:1.5vh;
                    ">
                        ✅ Conta verificada! Defina uma nova senha:
                    </p>

                    <input
                        type="password"
                        id="nova-senha"
                        placeholder="Nova senha"
                        required
                    >

                    <input
                        type="password"
                        id="confirmar-nova-senha"
                        placeholder="Confirmar nova senha"
                        required
                    >

                    <button type="button" id="botao-entre" onclick="redefinirSenha()">
                        SALVAR NOVA SENHA
                    </button>
                </section>
            </article>
        </section>
    </section>
    <footer>
        <section class="rodape-fim">
            <p>
                © 2025 CyberZone Lan House. Todos os direitos acadêmicos reservados.
            </p>
        </section>
    </footer>
    <script src="../js/main.js" type="module"></script>
    

</body>
</html>
