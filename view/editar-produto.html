<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <title>CyberZone - Editar Produto</title>
</head>
<body>
    <header>
        <section class="topo-marca"><h1>CYBERZONE</h1></section>
        <a href="#" id="botao-sair" onclick="realizarLogoutView()">Sair</a>
    </header>
    <nav class="menu-colorido"><ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="cadastro-cliente.html">Cad. Cliente</a></li>
        <li><a href="cadastro-computador.html">Cad. Computador</a></li>
        <li><a href="cadastro-funcionario.html">Cad. Funcionário</a></li>
        <li><a href="cadastro-produto.html">Cad. Produto</a></li>
        <li><a href="visualizar-clientes.html">Ver Clientes</a></li>
        <li><a href="visualizar-computadores.html">Ver Computadores</a></li>
        <li><a href="visualizar-funcionarios.html">Ver Funcionários</a></li>
        <li><a href="visualizar-produtos.html">Ver Produtos</a></li>
        <li><a href="uso-maquina.html">Uso de Máquina</a></li>
        <li><a href="venda.html">Venda</a></li>
    </ul></nav>
    <main class="cadastro-main">
        <section class="cadastro-caixa">
            <h2>Editar Produto</h2>
            <form class="cadastro-form" id="form-editar-produto">
                <input type="hidden" id="editar-produto-id">
                <input type="text" id="editar-nome-produto" placeholder="Nome do produto" required>
                <select id="editar-categoria-produto" required>
                    <option value="" disabled>Categoria</option>
                    <option value="bebida">Bebida</option>
                    <option value="alimento">Alimento / Snack</option>
                    <option value="periferico">Periférico</option>
                    <option value="recarga">Recarga / Crédito</option>
                    <option value="outro">Outro</option>
                </select>
                <input type="text" id="editar-descricao-produto" placeholder="Descrição">
                <input type="text" id="editar-preco-produto" placeholder="Preço (Ex: 7,50)" inputmode="numeric" required>
                <input type="text" id="editar-estoque-produto" placeholder="Quantidade em estoque" inputmode="numeric" required>
                <div style="display:flex;gap:1rem;margin-top:1vh;">
                    <button type="button" onclick="salvarEdicaoProduto()" style="flex:1;">SALVAR</button>
                    <button type="button" onclick="window.location.href='visualizar-produtos.html'" style="flex:1;background:#555;">CANCELAR</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
<section class="rodape-fim"><p>© 2025 CyberZone Lan House. Todos os direitos acadêmicos reservados.</p></section>
    </footer>
    <script src="../js/main.js" type="module"></script>
    
</body>
</html>
